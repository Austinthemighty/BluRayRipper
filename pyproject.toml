[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blurayripper"
version = "0.1.0"
description = "Automated Blu-ray/DVD -> Plex pipeline: MakeMKV rip, HandBrake H.265 encode, SubtitleEdit OCR to SRT, TMDB naming."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
# Web UI (not required for the CLI pipeline).
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
# Postgres-backed crash recovery (optional).
postgres = [
    "psycopg[binary]>=3.1",
]
# Share API credentials through Postgres, encrypted at rest (optional).
secrets = [
    "cryptography>=42.0",
]
# Read cover art from inside .iso sources (optional).
iso = [
    "pycdlib>=1.14",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
blurayripper = "blurayripper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
