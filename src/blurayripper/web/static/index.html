<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1116" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BluRayRipper" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" />
<link rel="apple-touch-icon" href="/icon.svg" />
<title>BluRayRipper</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #0e1116; color: #e6edf3; }
  header { padding: 14px 20px; background: #161b22; border-bottom: 1px solid #30363d; display:flex; align-items:center; gap:12px;}
  header h1 { font-size: 18px; margin: 0; }
  header .cap { color:#8b949e; font-size:12px; }
  .wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; padding: 16px 20px; }
  /* minmax(0,…) + min-width:0 let the columns shrink below their content's
     intrinsic width, so a nowrap job title ellipsizes instead of forcing the
     whole page wider than the screen (horizontal-scroll / clipped controls). */
  .wrap > * { min-width: 0; }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #8b949e; margin: 0 0 10px; }
  button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button.sec { background: #30363d; }
  button:disabled { opacity:.5; cursor: default; }
  .drive { display:flex; flex-direction:column; align-items:stretch; gap:8px; padding:8px; border:1px solid #30363d; border-radius:6px; margin-bottom:8px; }
  .drive small { color:#8b949e; display:block; }
  /* Let the text column shrink and ellipsize a long disc name so the buttons
     never get pushed off-screen. */
  .drive-info { min-width:0; flex:1; }
  .drive-info b, .drive-info .disc-name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .drive-btns { flex-shrink:0; display:flex; gap:6px; align-items:center; }
  .job { border:1px solid #30363d; border-radius:8px; padding:12px; margin-bottom:12px; }
  .thumb { height:44px; max-width:66px; border-radius:4px; object-fit:cover; border:1px solid #30363d; flex-shrink:0; }
  /* Newly-added/auto-opened job: a brief green pulse so it's not missed. */
  .job.flash { animation: jobflash 2.2s ease-out; }
  @keyframes jobflash {
    0%,15% { border-color:#2ea043; box-shadow:0 0 0 2px rgba(46,160,67,.5), 0 0 14px rgba(46,160,67,.5); }
    100%   { border-color:#30363d; box-shadow:none; }
  }
  #toasts { position:fixed; top:14px; right:14px; z-index:2000; display:flex; flex-direction:column; gap:8px; }
  .toast { background:#1f6feb; color:#fff; padding:9px 14px; border-radius:6px; font-size:13px;
    box-shadow:0 3px 10px rgba(0,0,0,.45); opacity:0; transform:translateY(-6px); transition:opacity .2s, transform .2s; }
  .toast.show { opacity:1; transform:none; }
  /* Fullscreen grain A/B: fill the screen, controls stay visible below. */
  .grainab:fullscreen { max-width:none; width:100%; height:100%; background:#0d1117; box-sizing:border-box;
    padding:16px; display:flex; flex-direction:column; justify-content:center; }
  .grainab:fullscreen [data-gstage] { flex:1; width:auto; aspect-ratio:auto; cursor:zoom-out; }
  .job .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:#30363d; text-transform:uppercase; letter-spacing:.04em;}
  .badge.done{background:#238636;} .badge.failed{background:#da3633;} .badge.await{background:#9e6a03;}
  .bar { height: 8px; background:#30363d; border-radius:999px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:#1f6feb; width:0; transition:width .3s; }
  .stage { color:#8b949e; font-size:12px; }
  table { width:100%; border-collapse: collapse; margin-top:8px; font-size:13px; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid #21262d; }
  .log { font-family: ui-monospace, monospace; font-size:11px; color:#8b949e; max-height:120px; overflow:auto; margin-top:8px; white-space:pre-wrap; }
  input, select { background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:6px; padding:5px 8px; font-size:13px; min-width:0; max-width:100%; }
  .row { display:flex; gap:8px; align-items:center; margin:6px 0; flex-wrap:wrap; }
  .muted { color:#8b949e; }
  /* Mobile: stack the two columns, wrap the header, bigger touch targets. */
  @media (max-width: 760px) {
    .wrap { grid-template-columns: minmax(0, 1fr); padding: 10px; gap: 10px; }
    /* Queue first — on a phone you're monitoring; Drives/Add are one scroll down. */
    .wrap > .panel { order: -1; }
    header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
    header h1 { font-size: 20px; }
    #redoall { margin-left: 0 !important; }
    #stats, #bulkbar:not(:empty) { padding: 8px 10px; }
    .panel { padding: 12px; }
    .job { padding: 10px; }
    .job .top { gap: 6px; }
    .log { max-height: 78px; font-size: 10px; line-height: 1.45; }
    button, button.sec { padding: 9px 14px; font-size: 14px; }  /* easier taps */
    .thumb { height: 38px; }
    /* Header actions: full-width, evenly split so they're easy to tap. */
    header #redoall, header #refreshart, header #opensettings { flex: 1 1 40%; }
  }
  /* Top summary strip: at-a-glance counts across all jobs. */
  #stats { display:flex; flex-wrap:wrap; gap:8px; padding:10px 16px; border-bottom:1px solid #21262d; }
  .stat { display:flex; align-items:center; gap:6px; font-size:13px; color:#8b949e;
    background:#161b22; border:1px solid #30363d; border-radius:999px; padding:4px 12px; }
  .stat b { color:#e6edf3; font-variant-numeric:tabular-nums; }
  .stat.zero { opacity:.4; }
  .stat .dot { width:8px; height:8px; border-radius:50%; background:#8b949e; }
  .stat.rip  .dot{background:#58a6ff;} .stat.subs .dot{background:#d29922;}
  .stat.enc  .dot{background:#a371f7;} .stat.input .dot{background:#e3b341;}
  .stat.queued .dot{background:#6e7681;} .stat.done .dot{background:#3fb950;}
  .stat.fail .dot{background:#f85149;}
  .stat[data-cat]{cursor:pointer;} .stat[data-cat]:hover{border-color:#8b949e;}
  .stat.active{border-color:#58a6ff; color:#e6edf3; box-shadow:0 0 0 1px #58a6ff;}
  #bulkbar{display:flex; gap:8px; align-items:center;}
  #bulkbar:not(:empty){padding:10px 16px; border-bottom:1px solid #21262d;}
  .worker{display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid #21262d;}
  .worker:last-child{border-bottom:none;}
  .worker .wname, .worker .wsub{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .worker .wsub{font-size:12px;}
  /* Queue pagination bar */
  .pager{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:2px 0 12px; font-size:13px; color:#8b949e;}
  .pager:empty{display:none;}
  .pager select{padding:4px 6px;}
  .pager .pbtn{background:#30363d; color:#e6edf3; border:0; border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13px;}
  .pager .pbtn:disabled{opacity:.4; cursor:default;}
  .pager .pinfo{margin-left:auto; font-variant-numeric:tabular-nums;}
  /* Settings modal */
  #settings-modal{position:fixed; inset:0; background:rgba(1,4,9,.7); z-index:3000; display:none;
    align-items:flex-start; justify-content:center; overflow:auto; padding:24px;}
  #settings-modal.open{display:flex;}
  .sheet{background:#161b22; border:1px solid #30363d; border-radius:10px; max-width:860px; width:100%; margin:auto;
    padding:0 20px 16px; box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .sheet .shead{position:sticky; top:0; background:#161b22; padding:16px 0 10px; border-bottom:1px solid #21262d; z-index:1;}
  .sheet h2{margin:0; text-transform:none; letter-spacing:0; font-size:16px; color:#e6edf3;}
  .sgroup{border:1px solid #21262d; border-radius:8px; padding:8px 12px 10px; margin-top:12px;}
  .sgroup > h3{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#8b949e; margin:2px 0 6px;}
  .sfield{display:grid; grid-template-columns:210px 1fr; gap:6px 12px; align-items:center; padding:5px 0; border-top:1px solid #1b2129;}
  .sgroup .sfield:first-of-type{border-top:0;}
  .sfield > label{font-size:13px;}
  .sfield .fhelp{grid-column:2; font-size:12px; color:#8b949e;}
  .sfield.shadow{opacity:.7;}
  .sfield.overridden{background:rgba(88,166,255,.07); border-radius:6px;}
  .ovdot{color:#58a6ff; font-size:10px; vertical-align:1px;}
  .sfield input[type=text], .sfield input[type=number], .sfield select{width:100%;}
  .sfoot{position:sticky; bottom:0; background:#161b22; padding:12px 0 2px; border-top:1px solid #21262d; margin-top:12px;
    display:flex; gap:10px; align-items:center;}
  @media (max-width:760px){ .sfield{grid-template-columns:1fr;} .sfield .fhelp{grid-column:1;} #opensettings{margin-left:0;} }
</style>
</head>
<body>
<header>
  <h1>BluRayRipper</h1>
  <span class="cap" id="ver" title="Running version (git commit count + hash). Compare across machines to spot stale code."></span>
  <span class="cap" id="cap"></span>
  <button class="sec" id="redoall" style="margin-left:auto;" title="Re-OCR subtitles for every job that has names assigned (uses staged/cached subs; no re-encode).">Re-OCR all subtitles</button>
  <button class="sec" id="refreshart" title="Re-fetch the real poster + backdrop from TMDB for every named job, overwriting wrong/generic art in each folder.">Refresh artwork</button>
  <label class="cap"><input type="checkbox" id="autoconfirm"> Auto-confirm single matches</label>
  <button class="sec" id="opensettings" title="Edit server settings (saved to config/settings.local.json; applied on next restart).">⚙ Settings</button>
</header>
<div id="stats"></div>
<div id="bulkbar"></div>
<div class="wrap">
  <div>
    <div class="panel">
      <h2>Drives</h2>
      <div id="drives"><span class="muted">Loading…</span></div>
      <button class="sec" onclick="loadDrives()">Refresh</button>
    </div>
    <div class="panel" style="margin-top:16px;">
      <h2>Add by selector</h2>
      <div class="row">
        <input id="manualSrc" placeholder="disc:0 / iso:/path" style="flex:1;" />
        <button onclick="addManual()">Add</button>
      </div>
      <div class="muted" style="font-size:12px;">disc:N · iso:/x.iso · file:/BDMV · a .mkv file · a folder of .mkv</div>
    </div>
    <div class="panel" id="workers-panel" style="margin-top:16px; display:none;">
      <h2>Workers</h2>
      <div id="workers"></div>
    </div>
  </div>
  <div class="panel">
    <h2>Queue</h2>
    <div id="pager" class="pager"></div>
    <div id="jobs"><span id="placeholder" class="muted">No jobs yet. Add a disc from the left.</span></div>
  </div>
</div>

<div id="settings-modal">
  <div class="sheet">
    <div class="shead">
      <h2>Settings</h2>
      <div class="row" style="margin:6px 0 2px;">
        <label class="muted" style="font-size:12px;">Scope</label>
        <select id="settings-scope" onchange="openSettings(this.value)"><option value="global">Global (server + all workers)</option></select>
      </div>
      <div class="muted" id="settings-scope-note" style="font-size:12px;"></div>
      <div id="settings-osquota" style="font-size:12px;margin-top:4px;"></div>
    </div>
    <div id="settings-body"><span class="muted">Loading…</span></div>
    <div class="sfoot">
      <button onclick="saveSettings()">Save</button>
      <button class="sec" onclick="closeSettings()">Close</button>
      <button class="sec" onclick="testNotify()" title="Send a test push to the configured notify URL and report whether it was accepted.">🔔 Test notification</button>
      <span id="settings-msg" class="muted"></span>
      <button class="sec" onclick="restartServer(false)" style="margin-left:auto;" title="Restart the server to apply saved settings. Warns if a rip/encode/OCR is running.">↻ Restart server</button>
      <button class="sec" id="clear-worker-override" onclick="clearWorkerOverride()" style="display:none; margin-left:auto;" title="Remove this worker's saved override so it follows the global settings again.">Clear worker override</button>
    </div>
  </div>
</div>

<script>
let TMDB_OK = true;
let ARTV = 0;               // bumped on a manual artwork refresh to bust thumb caches
let pageSize = localStorage.getItem('brr_pagesize') || '50';  // '25'|'50'|'100'|'200'|'all'
let curPage = 0;            // current queue page (0-based)
const renderedState = {};   // jobId -> last state we built a card for

async function api(method, url, body) {
  const r = await fetch(url, {method, headers: {'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const text = await r.text();
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
  if (!r.ok) { throw new Error((data && data.detail) || r.statusText || ('HTTP ' + r.status)); }
  return data;
}

let drivesLoading = false;
async function loadDrives() {
  if (drivesLoading) return;          // don't stack refreshes
  drivesLoading = true;
  const el = document.getElementById('drives');
  try {
    const drives = await api('GET', '/api/drives');
    if (!drives.length) { el.innerHTML = '<span class="muted">No optical drives found.</span>'; return; }
    el.innerHTML = '';
    for (const d of drives) {
      const div = document.createElement('div');
      div.className = 'drive';
      const title = d.label || ('Drive ' + (d.device || ('disc:' + d.index)));
      if (d.makemkv_blind) {
        // OS sees a disc here but makemkvcon can't open the drive — not rippable
        // until the drive is reset. Show it so the panel matches File Explorer.
        div.innerHTML =
          `<div class="drive-info"><b>${title}</b>` +
          `<small class="disc-name" title="${d.disc_name||''}">${d.disc_name||''}</small>` +
          `<small style="color:#f85149;">⚠ Windows sees this disc but MakeMKV can't open the drive — reset/reconnect it (or try another drive).</small></div>`;
        el.appendChild(div);
        continue;
      }
      const disc = d.disc_name
        ? (d.disc_name + (d.os_detected ? ' <span class="muted" title="Detected by the OS — makemkvcon\'s quick probe missed it; a scan may still be slow or fail.">(via OS)</span>' : ''))
        : '<i>no disc / mounting…</i>';
      div.innerHTML =
        `<div class="drive-info"><b>${title}</b><small class="disc-name" title="${d.disc_name||''}">${disc}</small><small>disc:${d.index} ${d.device||''}</small></div>`;
      const btns = document.createElement('div');
      btns.className = 'drive-btns';
      const add = document.createElement('button');
      add.textContent = 'Add'; add.onclick = () => addDisc('disc:' + d.index);
      const ej = document.createElement('button');
      ej.className = 'sec'; ej.textContent = '⏏'; ej.title = 'Eject (open tray)';
      ej.style.padding = '6px 9px';
      ej.onclick = () => trayAction(d, 'eject');
      const cl = document.createElement('button');
      cl.className = 'sec'; cl.textContent = '⤒'; cl.title = 'Close tray';
      cl.style.padding = '6px 9px';
      cl.onclick = () => trayAction(d, 'close');
      const ren = document.createElement('button');
      ren.className = 'sec'; ren.textContent = '✎'; ren.title = 'Name this drive';
      ren.style.padding = '6px 9px';
      ren.onclick = () => renameDrive(d);
      btns.append(add, ej, cl, ren);
      div.appendChild(btns); el.appendChild(div);
    }
  } catch (e) {
    // Enumerating can be slow or briefly fail while a rip is active — keep the
    // last-known list instead of blanking the panel; only show errors if empty.
    if (!el.querySelector('.drive')) el.innerHTML = `<span class="muted">${e.message}</span>`;
  } finally {
    drivesLoading = false;
  }
}

function toast(msg){
  let host = document.getElementById('toasts');
  if (!host){ host = document.createElement('div'); host.id = 'toasts'; document.body.appendChild(host); }
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  host.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 250); }, 3500);
}
async function addDisc(source) {
  try {
    const res = await api('POST','/api/jobs',{source});
    const ids = (res && res.ids) || [];
    toast(ids.length ? `Added ${source} — queued as #${ids.join(', #')}` : `Added ${source}`);
  } catch(e){ alert(e.message);} }
async function renameDrive(d){
  const current = d.label || '';
  const name = prompt(`Name for drive ${d.device||('disc:'+d.index)} (blank to clear):`, current);
  if (name === null) return;
  try { await api('POST','/api/drives/name',{device:d.device,name}); await loadDrives(); }
  catch(e){ alert(e.message); }
}
async function trayAction(d, action){
  try { await api('POST','/api/drives/'+action,{device:d.device||null}); }
  catch(e){ alert((action==='eject'?'Eject':'Close tray')+' failed: '+e.message); }
}
function addManual(){ const v=document.getElementById('manualSrc').value.trim(); if(v) addDisc(v); }

function badgeClass(s){ if(s==='done')return'done'; if(s==='failed')return'failed'; if(s.startsWith('awaiting'))return'await'; return''; }

const EDITIONS = ['Theatrical Cut','Extended Cut',"Director's Cut",'Unrated','Special Edition'];
function editionSelectHtml(){
  const opts = EDITIONS.map(e=>`<option>${e}</option>`).join('');
  return `<select data-edsel><option value="">(none)</option>${opts}<option value="__other">Other…</option></select>`
       + `<input data-edother placeholder="Custom edition" style="width:150px;display:none;">`;
}
function wireEdition(scope){
  const sel = scope.querySelector('[data-edsel]'); if(!sel) return;
  const oth = scope.querySelector('[data-edother]');
  sel.onchange = ()=>{ oth.style.display = sel.value==='__other' ? '' : 'none'; if(sel.value==='__other') oth.focus(); };
}
function editionValue(scope){
  const sel = scope.querySelector('[data-edsel]'); if(!sel) return null;
  const v = sel.value==='__other' ? scope.querySelector('[data-edother]').value.trim() : sel.value;
  return v || null;
}

const RIP_STATES = ['scanning','selecting','ripping'];  // actual disc read
const IN_PROGRESS = ['confirming','encoding','extracting_subs','ocr_subs','identifying','placing'];
const AWAITING = ['awaiting_titles','awaiting_mapping','awaiting_grain','awaiting_match'];
const GROUP_LABELS = ['Failed','Ripping disc','Needs your input','In progress','Queued','Completed'];
function jobRank(j){
  const s = j.state;
  if (s==='failed') return 0;                // failures at the very top
  if (s==='done') return 5;
  if (AWAITING.includes(s)) return 2;        // needs you to confirm
  if (RIP_STATES.includes(s)) return 1;      // actively ripping/scanning a disc
  if (IN_PROGRESS.includes(s)) return 3;     // extracting subs / OCR / encoding
  return 4;                                  // queued / ready
}

const SUB_STATES = ['extracting_subs','ocr_subs','identifying'];
const ENC_STATES = ['encoding','placing','confirming'];
function catOf(s){
  if (s==='failed') return 'fail';
  if (s==='done') return 'done';
  if (RIP_STATES.includes(s)) return 'rip';
  if (SUB_STATES.includes(s)) return 'subs';
  if (ENC_STATES.includes(s)) return 'enc';
  if (AWAITING.includes(s)) return 'input';
  if (s==='ready') return 'queued';
  return null;
}
let jobFilter = null;  // active stat-chip filter (category key) or null = all
const STAT_DEFS = [['rip','Ripping'],['subs','Subtitles'],['enc','Encoding'],
  ['input','Needs you'],['queued','Queued'],['done','Done'],['fail','Failed']];
function renderStats(jobs){
  const host = document.getElementById('stats');
  if (!host) return;
  const c = {}; for (const [k] of STAT_DEFS) c[k]=0;
  for (const j of jobs){ const k = catOf(j.state); if (k) c[k]++; }
  host.innerHTML = STAT_DEFS.map(([cls,label]) =>
    `<span class="stat ${cls}${c[cls]?'':' zero'}${jobFilter===cls?' active':''}" data-cat="${cls}"><span class="dot"></span>${label} <b>${c[cls]}</b></span>`
  ).join('') + `<span class="stat" style="margin-left:auto;">Total <b>${jobs.length}</b></span>`;
  host.querySelectorAll('.stat[data-cat]').forEach(el => el.onclick = () => {
    jobFilter = (jobFilter === el.dataset.cat) ? null : el.dataset.cat;
    curPage = 0;                                 // filtered set changed — back to page 1
    renderJobs._sig = '';                        // force a re-layout of the list
    if (renderJobs._lastSnap) renderJobs(renderJobs._lastSnap);
  });
}

// Bulk-remove bar shown when a terminal filter (done/failed) is active.
function renderBulkBar(count){
  const host = document.getElementById('bulkbar');
  if (!host) return;
  if ((jobFilter==='fail' || jobFilter==='done') && count){
    const label = jobFilter==='fail' ? 'failed' : 'completed';
    const states = jobFilter==='fail' ? ['failed'] : ['done'];
    host.innerHTML = `<button class="sec" data-bulk>🗑 Remove all ${count} ${label}</button>
      <span class="muted" data-msg style="font-size:12px;"></span>`;
    host.querySelector('[data-bulk]').onclick = async () => {
      if (!confirm(`Remove all ${count} ${label} jobs?`)) return;
      host.querySelector('[data-msg]').textContent = 'Removing…';
      try { const r = await api('POST','/api/jobs/remove-by-state',{states});
            toast(`Removed ${r.removed} ${label} job(s)`); jobFilter=null; }
      catch(e){ host.querySelector('[data-msg]').textContent='⚠ '+e.message; }
    };
  } else host.innerHTML = '';
}

function renderWorkers(workers){
  const panel = document.getElementById('workers-panel');
  const host = document.getElementById('workers');
  if (!panel || !host) return;
  if (!workers || !workers.length){ panel.style.display = 'none'; return; }
  panel.style.display = '';
  host.innerHTML = workers.map(w => {
    const busy = w.job_id != null;
    const dot = w.stale ? '#f85149' : (busy ? '#3fb950' : '#6e7681');
    const state = w.stale ? 'stale — no heartbeat' : (busy ? 'job #'+w.job_id : 'idle');
    return `<div class="worker"><span class="dot" style="background:${dot};margin-top:5px;"></span>
      <div style="min-width:0;flex:1;">
        <div class="wname"><b>${w.id}</b></div>
        <div class="muted wsub">${state}${busy && w.stage ? ' · '+w.stage : ''}</div>
        <div class="muted" style="font-size:11px;">v${w.version||'?'} · seen ${w.age}s ago</div>
      </div></div>`;
  }).join('');
}

function renderPager(total, per, totalPages){
  const el = document.getElementById('pager');
  if (!el) return;
  const from = total ? curPage * per + 1 : 0;
  const to = Math.min(total, (curPage + 1) * per);
  const opts = ['25','50','100','200','all'].map(v =>
    `<option value="${v}"${v === String(pageSize) ? ' selected' : ''}>${v === 'all' ? 'All' : v}</option>`).join('');
  const nav = totalPages > 1
    ? `<button class="pbtn" data-prev${curPage <= 0 ? ' disabled' : ''}>‹ Prev</button>` +
      `<span>Page ${curPage + 1} / ${totalPages}</span>` +
      `<button class="pbtn" data-next${curPage >= totalPages - 1 ? ' disabled' : ''}>Next ›</button>`
    : '';
  const html = `<label>Per page <select data-size>${opts}</select></label>${nav}` +
    `<span class="pinfo">${total ? `${from}–${to} of ${total}` : '0'} job${total === 1 ? '' : 's'}</span>`;
  if (el._sig === html) return;   // don't rebuild each SSE tick (would drop an open dropdown)
  el._sig = html;
  el.innerHTML = html;
  const go = () => { renderJobs._sig = ''; if (renderJobs._lastSnap) renderJobs(renderJobs._lastSnap); };
  el.querySelector('[data-size]').onchange = (e) => {
    pageSize = e.target.value; localStorage.setItem('brr_pagesize', pageSize); curPage = 0; go();
  };
  const prev = el.querySelector('[data-prev]'); if (prev) prev.onclick = () => { curPage = Math.max(0, curPage - 1); go(); };
  const next = el.querySelector('[data-next]'); if (next) next.onclick = () => { curPage = curPage + 1; go(); window.scrollTo({top:0, behavior:'smooth'}); };
}

function renderJobs(snap) {
  renderJobs._lastSnap = snap;
  const host = document.getElementById('jobs');
  if (snap.version) { const v = document.getElementById('ver'); if (v) v.textContent = 'v' + snap.version; }
  renderStats(snap.jobs || []);           // counts always reflect ALL jobs
  renderWorkers(snap.workers || []);
  if (!snap.jobs || !snap.jobs.length) { host.innerHTML = '<span id="placeholder" class="muted">No jobs yet. Add a disc from the left.</span>'; renderedStateClear(); renderJobs._sig = ''; renderJobs._known = new Set(); renderBulkBar(0); const pg = document.getElementById('pager'); if (pg){ pg.innerHTML=''; pg._sig=''; } return; }
  const ph = document.getElementById('placeholder'); if (ph) ph.remove();
  const allJobs = [...snap.jobs].filter(j => !jobFilter || catOf(j.state)===jobFilter)
                                .sort((a,b) => jobRank(a)-jobRank(b) || a.id-b.id);
  renderBulkBar(allJobs.length);
  // Paginate — rendering 150+ heavy cards (logs, live SSE, thumbnails) at once
  // crashes phones. The sort puts active/needs-you jobs first, so page 1 is the
  // one that matters; use the per-page selector or filters to reach the rest.
  const total = allJobs.length;
  const per = pageSize === 'all' ? Math.max(total, 1) : (parseInt(pageSize) || 50);
  const totalPages = Math.max(1, Math.ceil(total / per));
  curPage = Math.min(Math.max(0, curPage), totalPages - 1);
  const jobs = allJobs.slice(curPage * per, curPage * per + per);
  renderPager(total, per, totalPages);
  const seen = new Set();
  for (const j of jobs) {
    seen.add(j.id);
    let card = document.getElementById('job-'+j.id);
    // Rebuild the card if state changed (so forms appear/disappear); else live-update.
    if (!card || renderedState[j.id] !== j.state) {
      card = card || Object.assign(document.createElement('div'), {id:'job-'+j.id, className:'job'});
      card.innerHTML = cardHtml(j);
      if (!card.parentNode) host.appendChild(card);
      renderedState[j.id] = j.state;
      card.querySelector('[data-remove]').onclick = () => removeJob(j);
      if (j.state==='awaiting_titles') buildTitles(card, j);
      if (j.state==='awaiting_mapping') buildMapping(card, j);
      if (j.state==='awaiting_grain') buildGrain(card, j);
      if (j.state==='awaiting_match') buildMatch(card, j);
      if (j.state==='ready') buildEdit(card, j);
      if (j.state==='done' || j.state==='failed') buildResting(card, j);
    }
    liveUpdate(card, j);
    // The preview often arrives a tick AFTER the card first entered awaiting_grain
    // (or after a recovery re-render), and buildGrain only runs on state change —
    // so re-render it here the moment j.preview shows up, else it's stuck on
    // "Rendering grain preview…" forever.
    if (j.state==='awaiting_grain' && j.preview && card && !card.querySelector('[data-ab]')) {
      buildGrain(card, j);
    }
  }
  // remove cards for jobs no longer present (leave group headers)
  for (const c of [...host.children]) {
    if (c.dataset && c.dataset.hdr !== undefined) continue;
    const id = +(c.id||'').split('-')[1];
    if (id && !seen.has(id)) c.remove();
  }
  // reorder into priority groups with headers — only when the order actually
  // changed, so a routine live update never rearranges the DOM (which would jump
  // the page / log scroll).
  const sig = jobs.map(j => jobRank(j)+':'+j.id).join(',');
  if (sig === renderJobs._sig) return;
  renderJobs._sig = sig;
  for (const h of [...host.querySelectorAll('[data-hdr]')]) h.remove();
  let lastRank = -1;
  for (const j of jobs) {
    const r = jobRank(j);
    if (r !== lastRank) {
      const hdr = document.createElement('div');
      hdr.dataset.hdr = '';
      hdr.textContent = GROUP_LABELS[r];
      hdr.style.cssText = 'font:600 12px system-ui;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 6px;border-bottom:1px solid #30363d;padding-bottom:3px;';
      host.appendChild(hdr);
      lastRank = r;
    }
    const card = document.getElementById('job-'+j.id);
    if (card) host.appendChild(card);
  }
  // Flash + scroll to any newly-appeared job so an added/auto-opened disc is
  // obvious — they land in the Queued group and are otherwise easy to miss.
  // (Skipped on the first render so a page load doesn't flash everything.)
  const nowIds = jobs.map(j => j.id);
  if (renderJobs._known) {
    const fresh = nowIds.filter(id => !renderJobs._known.has(id));
    if (fresh.length) {
      const first = document.getElementById('job-'+fresh[0]);
      if (first) first.scrollIntoView({behavior:'smooth', block:'nearest'});
      for (const id of fresh) {
        const c = document.getElementById('job-'+id);
        if (c){ c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); }
      }
    }
  }
  renderJobs._known = new Set(nowIds);
}
function renderedStateClear(){ for(const k of Object.keys(renderedState)) delete renderedState[k]; }

        <div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><b>${j.disc_name || j.source}</b> <span class="muted">#${j.id}</span></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
        <span class="badge ${badgeClass(j.state)}" data-badge>${j.state.replace(/_/g,' ')}</span>
        <button class="sec" data-remove title="Remove from queue" style="padding:2px 9px;">✕</button>
      </div>
    </div>

function removeJob(j){
  const active = !['done','failed','awaiting_titles','awaiting_mapping','awaiting_grain'].includes(j.state);
  if (active && !confirm('Cancel and remove this running job? In-progress rip/encode will be stopped.')) return;
  api('DELETE','/api/jobs/'+j.id).catch(e=>alert(e.message));
}

function liveUpdate(card, j){
  card.querySelector('[data-badge]').textContent = j.state.replace(/_/g,' ');
  card.querySelector('[data-badge]').className = 'badge '+badgeClass(j.state);
  card.querySelector('[data-bar]').style.width = Math.round(j.progress*100)+'%';
  card.querySelector('[data-stage]').textContent = j.error ? ('⚠ '+j.error) : (j.stage||'');
  const logEl = card.querySelector('[data-log]');
  const logText = (j.log||[]).join('\n');
  if (logEl.textContent !== logText) {           // don't reset scroll when unchanged
    const atBottom = logEl.scrollHeight - logEl.clientHeight - logEl.scrollTop < 4;
    const prevTop = logEl.scrollTop;
    logEl.textContent = logText;
    logEl.scrollTop = atBottom ? logEl.scrollHeight : prevTop;  // pin to newest, else keep place
  }
  if (j.state==='done' && j.outputs && j.outputs.length && !card.querySelector('[data-out]')) {
    const o=document.createElement('div'); o.className='muted'; o.dataset.out='1';
    o.style.fontSize='12px'; o.textContent = j.outputs.join('\n');
    card.querySelector('[data-body]').prepend(o);
  }
  if (j.state==='failed' && !card.querySelector('[data-retry]')) {
    const b=document.createElement('button'); b.dataset.retry='1'; b.textContent='Retry';
    b.style.marginTop='8px';
    b.onclick=()=>api('POST','/api/jobs/'+j.id+'/retry').catch(e=>alert(e.message));
    card.querySelector('[data-body]').appendChild(b);
  }
}

function buildMapping(card, j){
  const body = card.querySelector('[data-body]');
  const movie = (j.kind_guess !== 'tv');
  body.innerHTML = `
    <div class="row">
      <label><input type="radio" name="k${j.id}" value="movie" ${movie?'checked':''}> Movie</label>
      <label><input type="radio" name="k${j.id}" value="tv" ${!movie?'checked':''}> TV</label>
    </div>
    <div class="row"><input data-q placeholder="Title to search" value="${(j.disc_name||'').replace(/_/g,' ')}" style="flex:1;">
      <button class="sec" data-search>Search TMDB</button></div>
    <div data-results class="row"></div>
    <div data-tv></div>
    <div class="row">Film grain:
      <label><input type="radio" name="g${j.id}" value="off" checked> Off</label>
      <label><input type="radio" name="g${j.id}" value="on"> On</label>
      <label><input type="radio" name="g${j.id}" value="preview"> Preview after rip</label>
    </div>
    <div class="row"><button data-confirm disabled>Confirm naming</button></div>`;
  const state = { chosen:null, kind: movie?'movie':'tv', episodes:[] };
  body.querySelectorAll(`input[name=k${j.id}]`).forEach(r=>r.onchange=()=>{state.kind=r.value; body.querySelector('[data-tv]').innerHTML=''; });
  async function doSearch(){
    const q = body.querySelector('[data-q]').value.trim(); if(!q) return;
    const rdiv = body.querySelector('[data-results]');
    rdiv.innerHTML = '<span class="muted">Searching TMDB…</span>';
    try {
      const res = await api('GET',`/api/tmdb/search?kind=${state.kind}&query=${encodeURIComponent(q)}`);
      if (!res || res.length === 0) {
        rdiv.innerHTML = '<span class="muted">No TMDB matches — edit the title and search again.</span>';
        return;
      }
      if (res.length === 1) {
        state.chosen = res[0];
        rdiv.innerHTML = `<span class="muted">Matched <b>${res[0].title} (${res[0].year||'?'})</b> — set grain/edition, then Confirm</span>`;
        await afterChoose();
        const auto = document.getElementById('autoconfirm');
        if (state.kind === 'movie' && auto && auto.checked) { await doConfirm(); }
        return;
      }
      const sel = document.createElement('select');
      res.slice(0,15).forEach(c=>{ const o=document.createElement('option'); o.value=JSON.stringify(c); o.textContent=`${c.title} (${c.year||'?'})`; sel.appendChild(o); });
      rdiv.innerHTML=''; rdiv.appendChild(sel);
      const pick=()=>{ state.chosen=JSON.parse(sel.value); afterChoose(); }; sel.onchange=pick; pick();
    } catch(e){ rdiv.innerHTML = '<span class="muted">'+e.message+'</span>'; }
  }
  body.querySelector('[data-search]').onclick = doSearch;
  async function afterChoose(){
    const tv = body.querySelector('[data-tv]');
    if (state.kind==='tv') {
      tv.innerHTML = `<div class="row">Season <input data-season type="number" value="1" min="0" style="width:64px;">
          First episode <input data-firstep type="number" value="1" min="0" style="width:64px;">
          <button class="sec" data-load>Load episodes</button></div>
        <div class="muted" style="font-size:12px;">DVD titles are usually in order; Blu-ray titles are often scrambled or reversed — pick each title's episode below (durations shown to help match), or use a fill button.</div>
        <div data-fill class="row" style="display:none;">
          <button class="sec" data-order>Fill in order (DVD)</button>
          <button class="sec" data-runtime>Match by runtime (Blu-ray)</button>
          <button class="sec" data-identify title="Rip these titles, then match each to an episode by comparing subtitles (needs an OpenSubtitles key).">Auto-identify by subtitles</button></div>
        <div data-eps></div>`;
      const sel = () => j.titles.filter(t=>j.selected.includes(t.id));
      const pad = n => String(n).padStart(2,'0');
      const epOptions = (num) => state.episodes.map(e=>
        `<option value="${e.episode}" ${e.episode===num?'selected':''}>E${pad(e.episode)} — ${e.name||'?'}${e.runtime?' · '+e.runtime+'m':''}</option>`).join('');
      const render = (assign, flags) => {
        const s=+tv.querySelector('[data-season]').value;
        tv.querySelector('[data-eps]').innerHTML = sel().map(t=>
          `<div class="row">Title ${t.id} <span class="muted">${t.duration}</span> → S${pad(s)}
            <select data-ep="${t.id}" style="max-width:360px;">${epOptions(assign[t.id])}</select>
            ${flags&&flags.has(t.id)?'<span title="Several episodes share this runtime, so runtime cannot tell them apart — verify this one." style="color:#d29922;">⚠ ambiguous</span>':''}</div>`).join('');
        body.querySelector('[data-confirm]').disabled=false;
      };
      const inOrder = () => { const start=+tv.querySelector('[data-firstep]').value||1; const a={}; sel().forEach((t,i)=>a[t.id]=start+i); return a; };
      const byRuntime = () => {
        // Greedy nearest-runtime, with a tie flag: a title is "ambiguous" when
        // more than one episode sits within ~90s of its duration, since runtime
        // can't separate same-length episodes.
        const used=new Set(), a={}, flags=new Set();
        sel().forEach(t=>{
          let best=null, bd=Infinity;
          state.episodes.forEach(e=>{ if(used.has(e.episode)) return; const er=(e.runtime||0)*60; const d=er?Math.abs(er-(t.seconds||0)):Infinity; if(d<bd){bd=d;best=e.episode;} });
          if(best==null) best=state.episodes.map(e=>e.episode).find(n=>!used.has(n));
          if(best!=null){ used.add(best); a[t.id]=best; }
          const near=state.episodes.filter(e=>e.runtime && Math.abs(e.runtime*60-(t.seconds||0))<=90);
          if(near.length>1 || !state.episodes.some(e=>e.runtime)) flags.add(t.id);
        });
        return {a, flags};
      };
      tv.querySelector('[data-load]').onclick = async () => {
        const s=+tv.querySelector('[data-season]').value;
        try { state.episodes = await api('GET',`/api/tmdb/season?tv_id=${state.chosen.id}&season=${s}`);} catch(e){ state.episodes=[]; }
        state.byNum={}; state.episodes.forEach(e=>state.byNum[e.episode]=e.name);
        if(!state.episodes.length){ tv.querySelector('[data-eps]').innerHTML='<span class="muted">No episodes found for that season.</span>'; return; }
        tv.querySelector('[data-fill]').style.display='';
        render(inOrder());
      };
      tv.querySelector('[data-order]').onclick = () => render(inOrder());
      tv.querySelector('[data-runtime]').onclick = () => {
        if(!state.episodes.some(e=>e.runtime)) alert('TMDB has no episode runtimes for this season — pick episodes manually from the dropdowns.');
        const {a, flags} = byRuntime();
        render(a, flags);
      };
      tv.querySelector('[data-identify]').onclick = async () => {
        const season=+tv.querySelector('[data-season]').value;
        const first=+tv.querySelector('[data-firstep]').value||1;
        const ids=sel().map(t=>t.id);
        const episodes=ids.map((_,i)=>first+i);  // the episodes on this disc
        const gmode = body.querySelector(`input[name=g${j.id}]:checked`).value;
        const tune_grain = gmode==='on'?true:(gmode==='off'?false:null);
        if(!confirm(`Rip ${ids.length} title(s), then auto-identify against episodes ${episodes.join(', ')} of "${state.chosen.title}" S${pad(season)} by subtitles?`)) return;
        try {
          await api('POST',`/api/jobs/${j.id}/auto-identify`,{title_ids:ids, show_title:state.chosen.title, show_year:state.chosen.year, show_tmdb_id:state.chosen.id, season, episodes, grain_mode:gmode, tune_grain});
        } catch(e){ alert(e.message); }
      };
    } else {
      tv.innerHTML = `<div class="muted">Will name ${j.selected.length} selected title(s) as this movie.</div>
        <div class="row">Edition ${editionSelectHtml()}</div>`;
      wireEdition(tv);
      body.querySelector('[data-confirm]').disabled=false;
    }
  }
  async function doConfirm(){
    if(!state.chosen){ alert('Pick a title first'); return; }
    let assignments=[];
    if (state.kind==='movie') {
      const ed = editionValue(body);
      assignments = j.selected.map(tid=>({title_id:tid, kind:'movie', show_or_movie_title:state.chosen.title, year:state.chosen.year, edition:ed}));
    } else {
      const s=+body.querySelector('[data-season]').value;
      const byNum=state.byNum||{};
      assignments = [...body.querySelectorAll('select[data-ep]')].map(sel=>({
        title_id:+sel.dataset.ep, kind:'tv', show_or_movie_title:state.chosen.title, year:state.chosen.year,
        season:s, episode:+sel.value, episode_title: byNum[+sel.value]||null }));
      const eps = assignments.map(a=>a.episode);
      if (new Set(eps).size !== eps.length && !confirm('Two titles map to the same episode — continue anyway?')) return;
    }
    const gmode = body.querySelector(`input[name=g${j.id}]:checked`).value;
    const tune_grain = gmode==='on' ? true : (gmode==='off' ? false : null);
    try { await api('POST',`/api/jobs/${j.id}/mapping`,{assignments, grain_mode:gmode, tune_grain}); } catch(e){ alert(e.message); }
  }
  body.querySelector('[data-confirm]').onclick = doConfirm;
  doSearch();  // auto-search on the pre-filled disc name (one match auto-confirms)
}

function lightbox(items, start){
  // items: [{label, src}] overlaid in the same spot; ← / → flips between them
  // instantly (both already loaded) so grain differences pop in place.
  let i = start || 0;
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;cursor:zoom-out;';
  const imgs = items.map(it=>`<img src="${it.src}" style="max-width:96vw;max-height:86vh;grid-area:1/1;">`).join('');
  ov.innerHTML = `<div data-lbl style="color:#e6edf3;font:14px monospace;margin-bottom:8px;"></div>
    <div style="display:grid;">${imgs}</div>
    <div style="color:#8b949e;font:12px monospace;margin-top:8px;">← / → flip · Esc or click to close</div>`;
  const els = [...ov.querySelectorAll('img')], lbl = ov.querySelector('[data-lbl]');
  const show = ()=>{ els.forEach((e,k)=>e.style.display = k===i?'':'none'); lbl.textContent = 'Grain '+items[i].label; };
  const onkey = (e)=>{
    if (e.key==='ArrowRight'||e.key==='ArrowLeft'){ i=(i+(e.key==='ArrowRight'?1:items.length-1))%items.length; show(); e.preventDefault(); }
    else if (e.key==='Escape'){ close(); }
  };
  const close = ()=>{ document.removeEventListener('keydown', onkey); ov.remove(); };
  ov.onclick = close;
  document.addEventListener('keydown', onkey);
  show();
  document.body.appendChild(ov);
}
function buildResting(card, j){
  // done/failed jobs: offer a subtitle re-OCR (staged rip or cached subs).
  const body = card.querySelector('[data-body]');
  let html = `<div class="row"><button class="sec" data-redosubs title="Re-OCR subtitles from this job's staged rip or cached subs (no re-encode).">Redo subtitles</button><span data-msg class="muted"></span></div>`;
  // Failed disc job: let the user move the disc to another drive and rip from it
  // (a different drive can often read a sector the original couldn't).
  const isDisc = (j.source||'').startsWith('disc:');
  // Only when the disc is still needed (a title left to rip) — not for an
  // encode/subtitle failure, where the rip is already done.
  if (j.state === 'failed' && isDisc && j.needs_disc) {
    html += `<div class="row"><span class="muted">Rip from drive:</span>` +
      `<select data-drivesel style="flex:1;min-width:0;"><option value="${j.source}">${j.source} (current)</option></select>` +
      `<button class="sec" data-changedrive>Use this drive</button><span data-cmsg class="muted"></span></div>` +
      `<div class="muted" style="font-size:12px;">Move the disc to the other drive, pick it here, then Retry.</div>`;
  }
  body.innerHTML = html;
  body.querySelector('[data-redosubs]').onclick = async () => {
    const msg = body.querySelector('[data-msg]');
    msg.textContent = 'Re-OCR subtitles… (watch the log)';
    try { await api('POST','/api/jobs/'+j.id+'/redo-subs'); }
    catch(e){ msg.textContent = '⚠ '+e.message; }
  };
  const sel = body.querySelector('[data-drivesel]');
  if (sel) {
    fetch('/api/drives').then(r=>r.json()).then(drives=>{
      const cur = j.source;
      sel.innerHTML = '';
      for (const d of (drives||[])) {
        if (d.makemkv_blind || d.index < 0) continue;   // not rippable
        const opt = document.createElement('option');
        opt.value = 'disc:' + d.index;
        opt.textContent = `disc:${d.index} — ${d.disc_name || '(no disc)'} [${d.device||''}]`
          + (opt.value === cur ? ' (current)' : '');
        sel.appendChild(opt);
      }
      if (![...sel.options].some(o=>o.value===cur)) {
        const o=document.createElement('option'); o.value=cur; o.textContent=cur+' (current)'; sel.appendChild(o);
      }
      sel.value = cur;
    }).catch(()=>{});
    body.querySelector('[data-changedrive]').onclick = async () => {
      const cmsg = body.querySelector('[data-cmsg]');
      const src = sel.value;
      if (src === j.source) { cmsg.textContent = 'Pick a different drive first.'; return; }
      cmsg.style.color = '#8b949e'; cmsg.textContent = 'Changing…';
      try {
        await api('POST','/api/jobs/'+j.id+'/change-source', {source: src});
        cmsg.style.color = '#3fb950'; cmsg.textContent = `Set to ${src} — now click Retry.`;
        j.source = src;
      } catch(e){ cmsg.style.color = '#f85149'; cmsg.textContent = '⚠ '+e.message; }
    };
  }
}

function buildMatch(card, j){

  body.innerHTML = `<div class="muted" style="font-size:12px;">Subtitle match for <b>${m.show}</b> S${pad(m.season)} — confirm each title's episode. ⚠ = runtime/subs couldn't decide confidently.</div>`
    + m.candidates.map(c=>`<div class="row">Title ${c.title_id} →
        <select data-mep="${c.title_id}">${opts(c.episode)}</select>
        <span class="muted">score ${c.score}${c.runner_up!=null?` · next E${pad(c.runner_up)} ${c.runner_up_score}`:''}</span>
        ${c.confident?'<span style="color:#3fb950;">✓</span>':'<span style="color:#d29922;">⚠</span>'}</div>`).join('')
    + `<div class="row"><button data-confirmmatch>Confirm episodes</button><span data-msg class="muted"></span></div>`;
  body.querySelector('[data-confirmmatch]').onclick = async () => {

    catch(e){ body.querySelector('[data-msg]').textContent='⚠ '+e.message; }
  };
}

// Synced A/B grain player: two clips stacked in the same box, only the visible
// one plays so they stay frame-locked. ← / → / Space (or the Flip button) swap
// which encode is shown, carrying the exact playhead across so you compare the
// same instant. Falls back to stills if a job has no clips. Returns a DOM node.
function grainVideoAB(offSrc, onSrc, offPoster, onPoster){
  const wrap = document.createElement('div');
  wrap.tabIndex = 0;
  wrap.className = 'grainab';
  wrap.style.cssText = 'outline:none;max-width:520px;';
  wrap.innerHTML = `
    <div data-gstage style="position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid #30363d;cursor:zoom-in;">
      <video data-voff muted loop playsinline preload="auto" poster="${offPoster||''}" src="${offSrc}"
             style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;"></video>
      <video data-von muted loop playsinline preload="auto" poster="${onPoster||''}" src="${onSrc}"
             style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;"></video>
      <div data-gbadge style="position:absolute;top:6px;left:6px;padding:2px 8px;border-radius:3px;background:rgba(0,0,0,.7);color:#e6edf3;font:600 12px monospace;">Grain OFF</div>
    </div>
    <div class="row" style="gap:8px;align-items:center;margin-top:6px;">
      <button class="sec" data-play title="Play / pause (Space)" style="min-width:40px;">▶</button>
      <input data-seek type="range" min="0" max="1000" value="0" style="flex:1;">
      <button class="sec" data-flip title="Flip OFF/ON (← / →)">Flip ⇄</button>
      <button class="sec" data-fs title="Fullscreen (F · double-click)">⛶</button>
    </div>
    <div class="muted" style="font-size:12px;">← / → or Flip swaps OFF/ON instantly in place · F or double-click = fullscreen · watch flat areas (skies, walls) and motion.</div>`;
  const stage = wrap.querySelector('[data-gstage]');
  const voff = wrap.querySelector('[data-voff]'), von = wrap.querySelector('[data-von]');
  const badge = wrap.querySelector('[data-gbadge]'), seek = wrap.querySelector('[data-seek]');
  const playBtn = wrap.querySelector('[data-play]');
  let showOn = false, playing = false;   // start paused — no autoplay
  // Both clips play at once; a flip is just an opacity swap, so it's instant —
  // no seek/decode stutter. The hidden clip is kept in sync with the visible one
  // (invisible corrections don't stutter), so whichever you flip to is already on
  // the right frame.
  const master = () => showOn ? von : voff;
  const hidden = () => showOn ? voff : von;
  const paint = () => {
    von.style.opacity = showOn ? 1 : 0;
    voff.style.opacity = showOn ? 0 : 1;
    badge.textContent = 'Grain ' + (showOn ? 'ON' : 'OFF');
  };
  const flip = () => { showOn = !showOn; paint(); };
  const togglePlay = () => {
    playing = !playing;
    playBtn.textContent = playing ? '⏸' : '▶';
    if (playing) { voff.play().catch(()=>{}); von.play().catch(()=>{}); }
    else { voff.pause(); von.pause(); }
  };
  const toggleFs = () => {
    if (document.fullscreenElement === wrap) document.exitFullscreen().catch(()=>{});
    else wrap.requestFullscreen ? wrap.requestFullscreen().then(()=>wrap.focus()).catch(()=>{}) : null;
  };
  playBtn.onclick = togglePlay;
  wrap.querySelector('[data-flip]').onclick = flip;
  wrap.querySelector('[data-fs]').onclick = toggleFs;
  stage.ondblclick = toggleFs;
  voff.addEventListener('timeupdate', () => { if (!showOn && voff.duration) seek.value = 1000*voff.currentTime/voff.duration; });
  von.addEventListener('timeupdate',  () => { if ( showOn && von.duration)  seek.value = 1000*von.currentTime/von.duration; });
  seek.addEventListener('input', () => {
    const t = (seek.value/1000) * (master().duration || 0);
    voff.currentTime = t; von.currentTime = t;      // scrub both together
  });
  wrap.addEventListener('keydown', (e) => {
    if (e.key==='ArrowLeft' || e.key==='ArrowRight'){ flip(); e.preventDefault(); }
    else if (e.key===' '){ togglePlay(); e.preventDefault(); }
    else if (e.key==='f' || e.key==='F'){ toggleFs(); e.preventDefault(); }
  });
  // Drift correction: nudge the hidden clip to the visible one's playhead when
  // they slip apart. Self-cleans when the card is rebuilt (node disconnected).
  const sync = setInterval(() => {
    if (!wrap.isConnected) { clearInterval(sync); return; }
    if (!playing) return;
    const m = master(), h = hidden();
    if (m.duration && h.readyState >= 2 && Math.abs(h.currentTime - m.currentTime) > 0.05) {
      try { h.currentTime = m.currentTime; } catch (e) {}
    }
  }, 150);
  paint();
  return wrap;
}

// Render the grain A/B into `host`: synced video if clips exist, else still-image lightbox.
function grainCompare(host, preview){
  if (preview.off_clip && preview.on_clip){
    host.appendChild(grainVideoAB(preview.off_clip, preview.on_clip, preview.off, preview.on));
    return;
  }
  host.innerHTML = `<div class="row" style="align-items:flex-start;">
      <div><div class="muted">Grain OFF</div><img data-imgoff src="${preview.off}" style="width:320px;max-width:46vw;border:1px solid #30363d;cursor:zoom-in;"></div>
      <div><div class="muted">Grain ON</div><img data-imgon src="${preview.on}" style="width:320px;max-width:46vw;border:1px solid #30363d;cursor:zoom-in;"></div>
    </div>`;
  const items = [{label:'OFF',src:preview.off},{label:'ON',src:preview.on}];
  host.querySelector('[data-imgoff]').onclick = () => lightbox(items,0);
  host.querySelector('[data-imgon]').onclick = () => lightbox(items,1);
}

function buildGrain(card, j){
  const body = card.querySelector('[data-body]');

const esc = (s) => String(s == null ? '' : s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
let settingsScope = 'global';
async function openSettings(scope){
  scope = (typeof scope === 'string' && scope) ? scope : 'global';
  settingsScope = scope;
  const modal = document.getElementById('settings-modal');
  const body = document.getElementById('settings-body');
  document.getElementById('settings-msg').textContent = '';
  body.innerHTML = '<span class="muted">Loading…</span>';
  modal.classList.add('open');
  let data;
  try { data = await api('GET','/api/settings?scope=' + encodeURIComponent(scope)); }
  catch(e){ body.innerHTML = `<span style="color:#f85149;">Failed to load: ${esc(e.message)}</span>`; return; }
  const worker = data.scope === 'worker';

  // Populate the scope dropdown (only the global payload lists the workers).
  const sel = document.getElementById('settings-scope');
  sel.value = scope;
  if (!worker) {
    const opts = ['<option value="global">Global (server + all workers)</option>'];
    for (const w of (data.workers || [])) opts.push(`<option value="${esc(w)}">Worker: ${esc(w)}</option>`);
    sel.innerHTML = opts.join('');
    sel.value = 'global';
  }
  renderOsQuota();
  const note = document.getElementById('settings-scope-note');
  if (worker) {
    note.innerHTML = `Overrides for <b>${esc(scope)}</b> — applied on its <b>next job</b> (no restart). ` +
      `Fields left at the global value aren't overridden. Highlighted = overridden.`;
  } else if (data.durable === false && (data.workers||[]).length === 0) {
    note.innerHTML = `Saved to <code>config/settings.local.json</code>; applied on restart. ` +
      `Per-worker overrides need Postgres (currently unavailable), so no workers are listed.`;
  } else {
    note.innerHTML = `Saved to <code>config/settings.local.json</code>; applied on the next server restart. ` +
      `Pick a worker above to override settings for just that machine. DB connection lives in <code>secrets.env</code>.`;
  }
  // Restart is a server (global) action; Clear-override is worker-only.
  const rb = document.querySelector('#settings-modal [onclick^="restartServer"]');
  if (rb) rb.style.display = worker ? 'none' : '';
  const cb = document.getElementById('clear-worker-override');
  if (cb) cb.style.display = worker ? '' : 'none';

  body.innerHTML = '';
  for(const g of data.groups){
    const gd = document.createElement('div'); gd.className = 'sgroup';
    gd.innerHTML = `<h3>${esc(g.title)}</h3>`;
    for(const f of g.fields){
      const id = `set_${f.section}_${f.key}`;
      const shadowed = f.env_value != null;   // only in global scope
      const dis = shadowed ? 'disabled' : '';
      let ctrl;
      if(f.type === 'bool'){
        ctrl = `<input type="checkbox" id="${id}" ${f.value ? 'checked' : ''} ${dis}>`;
      } else if(f.type === 'choice'){
        const cur = shadowed ? f.env_value : f.value;
        ctrl = `<select id="${id}" ${dis}>` +
          f.choices.map(c => `<option ${String(cur)===c?'selected':''}>${esc(c)}</option>`).join('') + `</select>`;
      } else if(f.type === 'int'){
        ctrl = `<input type="number" id="${id}" value="${esc(shadowed ? f.env_value : f.value)}" ${dis}>`;
      } else {
        const raw = f.type === 'list' ? (Array.isArray(f.value) ? f.value.join(', ') : f.value) : f.value;
        ctrl = `<input type="text" id="${id}" value="${esc(shadowed ? f.env_value : raw)}" ${dis}>`;
      }
      const row = document.createElement('div');
      row.className = 'sfield' + (shadowed ? ' shadow' : '') + (f.overridden ? ' overridden' : '');
      row.dataset.section = f.section; row.dataset.key = f.key; row.dataset.type = f.type;
      row.dataset.shadow = shadowed ? '1' : '';
      let note2 = f.help || '';
      if(shadowed) note2 = `Set in secrets.env (${f.env}) — that overrides this. ` + note2;
      else if(worker) note2 = `Global: ${f.type==='bool' ? (f.base?'on':'off') : (f.base===''||f.base==null?'(blank)':f.base)}. ` + note2;
      row.innerHTML = `<label for="${id}">${esc(f.label)}${f.overridden ? ' <span class="ovdot" title="Overridden for this worker">●</span>' : ''}</label><div>${ctrl}</div>` +
        (note2 ? `<div class="fhelp">${esc(note2)}</div>` : '');
      gd.appendChild(row);
    }
    body.appendChild(gd);
  }
}
async function renderOsQuota(){
  const el = document.getElementById('settings-osquota');
  el.textContent = 'OpenSubtitles: checking quota…'; el.style.color = '#8b949e';
  let q;
  try { q = await api('GET','/api/opensubtitles/quota'); }
  catch(e){ el.textContent = ''; return; }
  if (!q || q.configured === false){ el.textContent = 'OpenSubtitles: no API key configured.'; return; }
  if (q.error){ el.style.color = '#e3b341'; el.textContent = 'OpenSubtitles quota: ' + q.error; return; }
  const rem = q.remaining;
  el.style.color = (rem === 0) ? '#f85149' : (rem != null && rem <= 5 ? '#e3b341' : '#3fb950');
  let txt;
  if (q.source === 'account') {
    txt = `OpenSubtitles: ${rem == null ? '?' : rem} of ${q.allowed == null ? '?' : q.allowed} downloads left today`
      + (q.vip ? ' (VIP)' : '');
  } else {  // captured from the last /download (login unavailable for this key)
    txt = `OpenSubtitles: ${rem == null ? '?' : rem} downloads left (as of your last reference download)`;
  }
  if (rem === 0) txt += q.reset_time ? ` — resets ${q.reset_time}.` : ' — resets daily; retry then or map manually.';
  el.textContent = txt;
}

async function saveSettings(){
  const updates = {};
  document.querySelectorAll('#settings-body .sfield').forEach(row => {
    if(row.dataset.shadow) return;   // env-shadowed inputs are disabled; don't send
    const {section, key, type} = row.dataset;
    const el = document.getElementById(`set_${section}_${key}`);
    if(!el) return;
    (updates[section] = updates[section] || {})[key] = (type === 'bool') ? el.checked : el.value;
  });
  const msg = document.getElementById('settings-msg');
  msg.style.color = '#8b949e'; msg.textContent = 'Saving…';
  try {
    const r = await api('POST','/api/settings?scope=' + encodeURIComponent(settingsScope), updates);
    msg.style.color = '#3fb950';
    msg.textContent = (r && r.applies === 'next job')
      ? 'Saved — the worker applies it on its next job.'
      : 'Saved. Restart the server to apply.';
    if (settingsScope !== 'global') openSettings(settingsScope);  // refresh override highlights
  } catch(e){ msg.style.color = '#f85149'; msg.textContent = 'Error: ' + e.message; }
}

async function restartServer(force){
  const msg = document.getElementById('settings-msg');
  if(!force && !confirm('Restart the BluRayRipper server now?\n\nThis applies saved settings. The page will reconnect automatically.')) return;
  msg.style.color = '#8b949e'; msg.textContent = 'Requesting restart…';
  let r;
  try {
    r = await fetch('/api/server/restart', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({force: !!force})});
  } catch(e){ msg.style.color = '#f85149'; msg.textContent = 'Error: ' + e.message; return; }
  if(r.status === 409){   // jobs running — offer to force
    const det = (await r.json().catch(()=>({}))).detail || {};
    const list = (det.active || []).map(a => `#${a.id} ${a.name} (${a.state})`).join('\n');
    if(confirm(`${det.message || 'Jobs are running.'}\n\n${list}\n\nRestart anyway and interrupt them?`)){
      return restartServer(true);
    }
    msg.style.color = '#8b949e'; msg.textContent = 'Restart cancelled.';
    return;
  }
  if(!r.ok){ msg.style.color = '#f85149'; msg.textContent = 'Restart failed: HTTP ' + r.status; return; }
  msg.style.color = '#e3b341'; msg.textContent = 'Restarting… waiting for the server to come back.';
  let tries = 0;
  const poll = setInterval(async () => {
    tries++;
    try {
      const ok = await fetch('/api/jobs', {cache:'no-store'});
      if(ok.ok){ clearInterval(poll); msg.style.color = '#3fb950'; msg.textContent = 'Back up — reloading.'; setTimeout(() => location.reload(), 700); return; }
    } catch(e){ /* still down */ }
    if(tries > 60){ clearInterval(poll); msg.style.color = '#f85149'; msg.textContent = "Didn't come back within 90s — check the server console."; }
  }, 1500);
}

const ev = new EventSource('/api/events');
ev.onmessage = (m) => { try { renderJobs(JSON.parse(m.data)); } catch (e) { /* ignore a partial/empty frame */ } };
loadDrives();
setInterval(loadDrives, 10000);   // keep the drive list / loaded discs current
fetch('/api/jobs').then(r=>r.json()).then(renderJobs).catch(()=>{});
</script>
