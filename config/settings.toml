# BluRayRipper configuration.
# Copy/edit this file. Secrets (API keys) live in config/secrets.env, not here.
# Any value left blank/omitted falls back to an OS-specific default or auto-detection.

[tools]
# Absolute paths to the external binaries. Leave blank to auto-detect from PATH
# and common install locations (Program Files on Windows, PATH on Linux/macOS).
makemkvcon = ""
handbrakecli = ""
mkvmerge = ""
mkvextract = ""
# SubtitleEdit launcher. On Windows this is the path to SubtitleEdit.exe.
# On Linux/macOS, either a native "seconv"/"SubtitleEdit" binary, or leave
# subtitleedit pointing at SubtitleEdit.exe and set subtitleedit_runner = "mono".
subtitleedit = ""
subtitleedit_runner = ""   # e.g. "mono" on Linux/macOS; blank to run directly
ffmpeg = ""                # optional — only used for the grain-preview stills

[storage]
# Temp/staging root: per-job intermediates live here and are cleaned up after.
# Output root: final Plex library destination. Either may point at a NAS share.
staging_dir = "./staging"
output_dir = "./output"
# Sub-folders created under output_dir for each library type.
movies_subdir = "Movies"
tv_subdir = "TV Shows"

[encode]
container = "mkv"          # "mp4" or "mkv" (must match the preset's FileFormat)
preset_file = "config/presets.json"
preset_name = "BluRay UHD"
# Default film-grain handling (x265 --tune grain). Per-disc override in the web
# UI; "preview" mode there renders a still comparison before encoding.
tune_grain = false
# Run encodes below normal OS priority so ripping and the UI stay responsive
# (a 4K x265 encode otherwise pegs every core and starves new rips/drive scans).
low_priority = true
# Deinterlace: "auto" applies HandBrake's adaptive decomb to SD/DVD sources only
# (height <= deinterlace_max_height); "on" forces it; "off" never. Decomb only
# touches frames that are actually combed, so "auto" is safe on progressive SD.
deinterlace = "auto"
deinterlace_max_height = 576   # NTSC 480 / PAL 576 -> DVD-era SD ceiling

[languages]
# ISO 639-2/B 3-letter codes (as MakeMKV/mkvmerge report them) to KEEP.
keep = ["eng", "pol"]
# Default/primary language flagged for Plex.
default = "eng"

[scan]
min_length_seconds = 120   # ignore titles shorter than this (drops menus/trailers)

[disc]
# Eject the disc automatically once ripping finishes (before the encode runs),
# so you can swap in the next disc while encoding continues.
auto_eject = true
# Automatically scan a disc as soon as one is inserted (no need to click "Add").
# Known discs auto-rip; new ones park at the naming step.
auto_open = true
# How often (seconds) the web UI checks the drives for inserted/ejected discs.
poll_seconds = 15
# Copy the disc's own cover art (Blu-ray BDMV/META or DVD JACKET_P) to the movie
# folder as poster.jpg for Plex. Read before ripping, while the disc is still in.
extract_cover_art = true

[serve]
# At serve startup, kill leftover SubtitleEdit/MakeMKV/HandBrake processes
# orphaned by a prior crash or power-off (before any jobs run). Without this,
# orphans pile up across restarts until they exhaust the system commit limit
# (0xc000012d / WinError 1455 "paging file too small" out-of-memory errors).
cleanup_stale_tools = true
# How many jobs may prep (rip + subtitles + grain) at once. Caps the recovery
# stampede when a restart resumes many in-flight jobs. Keep low (1-3).
prep_concurrency = 2
# Auto re-queue a failed job this many times (exponential backoff) before
# leaving it FAILED for a manual Retry. 0 = never.
auto_retry_max = 2
# Push a notification (ntfy-style plain-text POST) when a job needs input or
# fails. Blank = off. Put it in secrets.env if the URL carries a token.
notify_url = ""   # e.g. "https://ntfy.sh/my-blurayripper". env: BLURAYRIPPER_NOTIFY_URL

[queue]
# Encode "budget" for the `queue` command. A UHD (2160p) encode costs 2 units,
# anything 1080p or smaller costs 1. Lowered to 1 to cap peak memory (never two
# encodes at once) on the memory-constrained VM.
encode_capacity = 1

[audio]
# "all"  = keep every track in your kept languages (incl. commentaries)
# "main" = keep only the first (primary) track per language
tracks = "all"

[subtitles]
fix_common_errors = true
remove_text_for_hi = false   # strip hearing-impaired (SDH) tags during OCR
ocr_concurrency = 2          # how many subtitle tracks to OCR in parallel (lowered
                             # from 4 to cap simultaneous SubtitleEdit memory)
ocr_timeout_seconds = 3600   # kill a track's OCR if it hangs this long (SubtitleEdit
                             # can stick on an error dialog and hold memory)
keep_extracted = true        # cache extracted .sup subs so re-OCR needs no re-rip
extract_concurrency = 2      # how many titles may read the rip + extract subs at once
                             # (keep low when the rip lives on a NAS)
# When set, each placed .srt is ALSO copied here (in a per-title subfolder) with
# a "<name>.info.txt" sheet pre-filling the OpenSubtitles manual-upload form
# (language, FPS, HD, hearing-impaired, forced/foreign-parts). Blank = off.
upload_export_dir = ""       # e.g. "./subtitle_uploads". env: BLURAYRIPPER_SUB_UPLOAD_DIR

[metadata]
provider = "tmdb"
language = "en-US"
write_nfo = true   # write a Kodi/Plex .nfo sidecar next to each output video

[web]
# Web UI bind address. "127.0.0.1" = this machine only (default, safest).
# Set host = "0.0.0.0" to reach the UI from other devices on your LAN.
# WARNING: there is no login — only expose on a trusted network, never to the
# internet. You may also need to allow the port through Windows Firewall.
host = "0.0.0.0"
port = 8723

[cluster]
# Distributed encoding across multiple servers. When true, the rip machine rips
# then queues jobs for `blurayripper worker` processes to encode (needs a shared
# Postgres + shared NAS). When false (default), this machine encodes inline.
use_workers = false
worker_poll_seconds = 5
heartbeat_seconds = 15
stale_after_seconds = 180
# When clustered, the rip box encodes a job itself if every title is <= this
# height; taller (e.g. UHD 2160p) jobs go to the workers. 0 = never encode
# locally (rip box only rips). 1080 = handle <=1080p on the rip box.
local_encode_max_height = 0
# When true, subtitle extraction + OCR move OFF the rip box onto the workers
# (run right before each encode), so restarting `serve` never kills in-flight
# extraction/OCR/encode. Requires use_workers; best paired with the above = 0.
worker_does_subs = false

[database]
# Postgres URL enables crash recovery — jobs persist and resume after a restart
# (a finished rip is never redone). Leave blank for in-memory (no persistence).
# Prefer setting BLURAYRIPPER_DATABASE_URL in secrets.env (it holds credentials).
url = ""
